<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="800"
  viewBox="0 0 1200 800"
>

  <!-- ===================== -->
  <!-- DEFINITIONS -->
  <!-- ===================== -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===================== -->
  <!-- BACKGROUND -->
  <!-- ===================== -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#bgGradient)"/>

  <!-- ===================== -->
  <!-- GRID -->
  <!-- ===================== -->
  <g stroke="#0F172A" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>

    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
    <line x1="1100" y1="0" x2="1100" y2="800"/>
  </g>

  <!-- ===================== -->
  <!-- TITLE -->
  <!-- ===================== -->
  <text x="40" y="60"
        font-family="Arial, sans-serif"
        font-size="28"
        fill="#E5E7EB">
    AI Risk Scoring Engine
  </text>

  <text x="40" y="90"
        font-family="Arial, sans-serif"
        font-size="14"
        fill="#94A3B8">
    Neural Credit &amp; Fraud Intelligence
  </text>

  <!-- ===================== -->
  <!-- NEURAL NODES -->
  <!-- ===================== -->
  <g fill="#22D3EE" filter="url(#glow)">
    <circle cx="300" cy="200" r="6"/>
    <circle cx="300" cy="300" r="6"/>
    <circle cx="300" cy="400" r="6"/>
    <circle cx="300" cy="500" r="6"/>

    <circle cx="500" cy="160" r="6"/>
    <circle cx="500" cy="260" r="6"/>
    <circle cx="500" cy="360" r="6"/>
    <circle cx="500" cy="460" r="6"/>
    <circle cx="500" cy="560" r="6"/>

    <circle cx="700" cy="220" r="6"/>
    <circle cx="700" cy="320" r="6"/>
    <circle cx="700" cy="420" r="6"/>
    <circle cx="700" cy="520" r="6"/>
  </g>

  <!-- ===================== -->
  <!-- NEURAL CONNECTIONS -->
  <!-- ===================== -->
  <g stroke="#6366F1" stroke-width="1" opacity="0.6">
    <line x1="300" y1="200" x2="500" y2="160"/>
    <line x1="300" y1="200" x2="500" y2="260"/>
    <line x1="300" y1="300" x2="500" y2="260"/>
    <line x1="300" y1="300" x2="500" y2="360"/>
    <line x1="300" y1="400" x2="500" y2="360"/>
    <line x1="300" y1="400" x2="500" y2="460"/>
    <line x1="300" y1="500" x2="500" y2="460"/>
    <line x1="300" y1="500" x2="500" y2="560"/>

    <line x1="500" y1="160" x2="700" y2="220"/>
    <line x1="500" y1="260" x2="700" y2="220"/>
    <line x1="500" y1="260" x2="700" y2="320"/>
    <line x1="500" y1="360" x2="700" y2="320"/>
    <line x1="500" y1="360" x2="700" y2="420"/>
    <line x1="500" y1="460" x2="700" y2="420"/>
    <line x1="500" y1="460" x2="700" y2="520"/>
    <line x1="500" y1="560" x2="700" y2="520"/>
  </g>

  <!-- ===================== -->
  <!-- RISK SCORE GAUGE -->
  <!-- ===================== -->
  <g transform="translate(900 350)">
    <circle cx="0" cy="0" r="120"
            fill="none"
            stroke="#1E293B"
            stroke-width="14"/>

    <path
      d="M -120 0 A 120 120 0 0 1 60 -104"
      fill="none"
      stroke="url(#accentGradient)"
      stroke-width="14"
      stroke-linecap="round"
    />

    <text x="0" y="10"
          text-anchor="middle"
          font-size="42"
          fill="#E5E7EB">
      82
    </text>

    <text x="0" y="40"
          text-anchor="middle"
          font-size="14"
          fill="#94A3B8">
      Risk Score
    </text>
  </g>

  <!-- ===================== -->
  <!-- TRANSACTION STREAM -->
  <!-- ===================== -->
  <g stroke="#22D3EE" stroke-width="2" fill="none">
    <polyline points="40,700 120,680 200,690 280,660 360,670 440,640 520,650"/>
    <polyline points="40,740 120,720 200,730 280,700 360,710 440,680 520,690"/>
  </g>

  <!-- ===================== -->
  <!-- FOOTER -->
  <!-- ===================== -->
  <text x="40" y="780"
        font-size="12"
        fill="#64748B">
    © AI FinTech Systems · Neural Risk Intelligence
  </text>

</svg>
