<?xml version="1.0" encoding="UTF-8"?>
<svg 
    xmlns="http://www.w3.org/2000/svg" 
    width="1200" 
    height="800" 
    viewBox="0 0 1200 800">

  <!-- ===================== -->
  <!-- DEFINITIONS -->
  <!-- ===================== -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#010316"/>
      <stop offset="100%" stop-color="#02051A"/>
    </linearGradient>

    <linearGradient id="riskGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===================== -->
  <!-- BACKGROUND -->
  <!-- ===================== -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- ===================== -->
  <!-- HEADER -->
  <!-- ===================== -->
  <text x="40" y="50"
        font-family="Arial, sans-serif"
        font-size="28"
        fill="#E5E7EB">
    AI Credit Scoring Dashboard
  </text>
  <text x="40" y="80"
        font-family="Arial, sans-serif"
        font-size="14"
        fill="#94A3B8">
    Loan Risk Analysis &amp; Credit Insights
  </text>

  <!-- ===================== -->
  <!-- RADIAL RISK CHART -->
  <!-- ===================== -->
  <g transform="translate(600 400)">
    <circle cx="0" cy="0" r="150" fill="none" stroke="#1E293B" stroke-width="12"/>
    <path d="M -150 0 A 150 150 0 0 1 100 -120" fill="none" stroke="url(#riskGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glowFilter)"/>
    <path d="M -150 0 A 150 150 0 0 1 50 130" fill="none" stroke="url(#riskGrad)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <text x="0" y="10" text-anchor="middle" font-size="42" fill="#E5E7EB">82</text>
    <text x="0" y="40" text-anchor="middle" font-size="14" fill="#94A3B8">Credit Score</text>
  </g>

  <!-- ===================== -->
  <!-- SCORE BARS -->
  <!-- ===================== -->
  <g transform="translate(150 200)">
    <text x="0" y="0" font-size="14" fill="#E5E7EB">Payment History</text>
    <rect x="0" y="10" width="200" height="16" rx="8" fill="#1E293B"/>
    <rect x="0" y="10" width="170" height="16" rx="8" fill="#22D3EE"/>
    
    <text x="0" y="50" font-size="14" fill="#E5E7EB">Credit Utilization</text>
    <rect x="0" y="60" width="200" height="16" rx="8" fill="#1E293B"/>
    <rect x="0" y="60" width="120" height="16" rx="8" fill="#FACC15"/>
    
    <text x="0" y="100" font-size="14" fill="#E5E7EB">Credit History Length</text>
    <rect x="0" y="110" width="200" height="16" rx="8" fill="#1E293B"/>
    <rect x="0" y="110" width="150" height="16" rx="8" fill="#22D3EE"/>
    
    <text x="0" y="150" font-size="14" fill="#E5E7EB">New Credit</text>
    <rect x="0" y="160" width="200" height="16" rx="8" fill="#1E293B"/>
    <rect x="0" y="160" width="80" height="16" rx="8" fill="#EF4444"/>
    
    <text x="0" y="200" font-size="14" fill="#E5E7EB">Credit Mix</text>
    <rect x="0" y="210" width="200" height="16" rx="8" fill="#1E293B"/>
    <rect x="0" y="210" width="140" height="16" rx="8" fill="#22D3EE"/>
  </g>

  <!-- ===================== -->
  <!-- RISK INDICATORS -->
  <!-- ===================== -->
  <g transform="translate(900 200)">
    <circle cx="0" cy="0" r="30" fill="#EF4444" opacity="0.8" filter="url(#glowFilter)"/>
    <text x="0" y="5" font-size="12" text-anchor="middle" fill="#FFFFFF">High</text>

    <circle cx="0" cy="80" r="30" fill="#FACC15" opacity="0.7" filter="url(#glowFilter)"/>
    <text x="0" y="85" font-size="12" text-anchor="middle" fill="#FFFFFF">Medium</text>

    <circle cx="0" cy="160" r="30" fill="#22D3EE" opacity="0.7" filter="url(#glowFilter)"/>
    <text x="0" y="165" font-size="12" text-anchor="middle" fill="#FFFFFF">Low</text>
  </g>

  <!-- ===================== -->
  <!-- FOOTER -->
  <!-- ===================== -->
  <text x="40" y="780"
        font-size="12"
        fill="#64748B">
    © AI FinTech Systems · Credit Risk Intelligence
  </text>

</svg>
