`<?xml version="1.0" encoding="UTF-8"?>
<svg 
    xmlns="http://www.w3.org/2000/svg" 
    width="1200" 
    height="800" 
    viewBox="0 0 1200 800">

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#010316"/>
      <stop offset="100%" stop-color="#02051A"/>
    </linearGradient>

    <linearGradient id="riskGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <text x="40" y="50"
        font-family="Arial, sans-serif"
        font-size="28"
        fill="#E5E7EB">
    Loan Risk Visualizer
  </text>
  <text x="40" y="80"
        font-family="Arial, sans-serif"
        font-size="14"
        fill="#94A3B8">
    AI-driven Loan Default Probability &amp; Risk Insights
  </text>

  <g fill="none" stroke="url(#riskGrad)" stroke-width="3" filter="url(#glowFilter)">
    <path d="M150 550 C200 530, 250 500, 300 520 S400 480, 450 500 S550 460, 600 480 S700 440, 750 460"/>
  </g>

  <g transform="translate(900 450)">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#1E293B" stroke-width="14"/>
    <path d="M -120 0 A 120 120 0 0 1 60 -104" fill="none" stroke="url(#riskGrad)" stroke-width="14" stroke-linecap="round"/>
    <text x="0" y="10" text-anchor="middle" font-size="42" fill="#E5E7EB">68</text>
    <text x="0" y="40" text-anchor="middle" font-size="14" fill="#94A3B8">Loan Risk Score</text>
  </g>

  <text x="40" y="780"
        font-size="12"
        fill="#64748B">
    © AI FinTech Systems · Loan Risk Intelligence
  </text>

</svg>`
